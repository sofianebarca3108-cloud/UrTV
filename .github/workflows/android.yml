
name: Build UrTV Screensaver Only

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screensaver:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build the page
        run: python3 src/build.py

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build screensaver APK only
        env:
          URTV_BRANCH: next
        run: gradle -p android :app:assembleRelease --no-daemon

      - name: Upload screensaver APK
        uses: actions/upload-artifact@v4
        with:
          name: urtv-screensaver
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7
